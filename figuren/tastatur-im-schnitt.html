<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tastatur im Schnitt</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>
.iso{--fk-cut:#2b2b2b;--fk-hatch:#5a5a5a}
.iso[data-theme="light"]{--fk-cut:#e2e2de;--fk-hatch:#8a8a8f}
.fk-cut{fill:url(#fk-hatch);stroke:none}
.fk-wire{stroke-width:1.1px}
.iso-line.fk-ring{fill:var(--fk-cut)}
#fk-blade[data-closed] .iso-edge{stroke:var(--anatomy-green)}
@media (max-width:560px){.iso-plate-corner[data-corner="hint"]{bottom:15px}}
.fk-pad[data-closed]>.iso-edge{stroke:var(--anatomy-green);stroke-width:1.3px}
.iso-plate{overflow:hidden}
.iso-stage{touch-action:pan-y;cursor:ns-resize;outline:none;margin:-52px -24px}
.iso-stage:focus-visible{box-shadow:0 0 0 1px var(--anatomy-mid)}

// Convex solids for the cutaway: boxes, lofts and tilted plates are lists of planar faces, clipped by a
// section plane and painted with the kit's classes (iso-fill, iso-shade, iso-top, iso-line) plus one extra
// class for the cut faces. Shared by build.mjs and the live page, so a leaf or a spring that changes shape
// is rebuilt from the same code the static art came from.


const EPS = 1e-7;
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = (a) => {
  const l = Math.hypot(a[0], a[1], a[2]) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
};
const mid = (points) => {
  const s = [0, 0, 0];
  for (const p of points) {
    s[0] += p[0];
    s[1] += p[1];
    s[2] += p[2];
  }
  return [s[0] / points.length, s[1] / points.length, s[2] / points.length];
};

function viewDir(P) {
  const { sinA, cosA, sinE, cosE } = cameraOf(P);
  return [cosA * cosE, sinA * cosE, sinE];
}

function newell(points) {
  const n = [0, 0, 0];
  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];
    n[0] += (a[1] - b[1]) * (a[2] + b[2]);
    n[1] += (a[2] - b[2]) * (a[0] + b[0]);
    n[2] += (a[0] - b[0]) * (a[1] + b[1]);

  return unit(n);
}

// A solid is { faces: [{ p: [[x,y,z]...], n, cut? }] } with outward normals.
function orient(faces) {
  const all = faces.flatMap((f) => f.p);
  const c = mid(all);
  return faces.map((f) => {
    let n = newell(f.p);
    let p = f.p;
    if (dot(n, sub(mid(p), c)) < 0) {
      p = [...p].reverse();
      n = mul(n, -1);
    }
    return { ...f, p, n };
  });

function boxFaces(x0, x1, y0, y1, z0, z1) {
  const q = (a, b, c, d) => ({ p: [a, b, c, d] });

    q([x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]),
    q([x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]),
    q([x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]),
    q([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]),
    q([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]),
    q([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]),

// Eight points: a bottom quad b0..b3 and the top quad t0..t3 above it (same order).
function hexaFaces(b, t) {
  const q = (...p) => ({ p });
  return orient([
    q(b[0], b[1], b[2], b[3]),
    q(t[0], t[1], t[2], t[3]),
    q(b[0], b[1], t[1], t[0]),
    q(b[1], b[2], t[2], t[1]),
    q(b[2], b[3], t[3], t[2]),
    q(b[3], b[0], t[0], t[3]),

// Two rings of the same length (convex, counter-clockwise from above) at heights z0 and z1.
function loftFaces(ring0, z0, ring1, z1) {
  const n = ring0.length;
  const faces = [{ p: ring0.map(([x, y]) => [x, y, z0]) }, { p: ring1.map(([x, y]) => [x, y, z1]) }];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    faces.push({ p: [[...ring0[i], z0], [...ring0[j], z0], [...ring1[j], z1], [...ring1[i], z1]] });

  return orient(faces);
}

// A thin plate from p0 to p1 in the x-z plane (points are [x, z]), thickness t across it, y from y0 to y1.
// Both ends are pushed out by half a thickness so two plates meeting at a bend overlap instead of leaving a notch.
function plateFaces([ax, az], [bx, bz], t, y0, y1, extend = true) {
  let dx = bx - ax;
  let dz = bz - az;
  const l = Math.hypot(dx, dz) || 1;
  dx /= l;
  dz /= l;
  const e = extend ? t / 2 : 0;
  const nx = -dz * t / 2;
  const nz = dx * t / 2;
  const A = [ax - dx * e, az - dz * e];
  const B = [bx + dx * e, bz + dz * e];
  const pt = (c, s, y) => [c[0] + nx * s, y, c[1] + nz * s];
  return hexaFaces(
    [pt(A, 1, y0), pt(B, 1, y0), pt(B, 1, y1), pt(A, 1, y1)],
    [pt(A, -1, y0), pt(B, -1, y0), pt(B, -1, y1), pt(A, -1, y1)],
  );
}

function clipPolygon(points, n, d) {
  const out = [];
  const on = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];
    const da = dot(n, a) - d;
    const db = dot(n, b) - d;
    if (da <= EPS) out.push(a);
    if (Math.abs(da) <= EPS) on.push(a);
    if ((da < -EPS && db > EPS) || (da > EPS && db < -EPS)) {
      const s = da / (da - db);
      const p = [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s, a[2] + (b[2] - a[2]) * s];
      out.push(p);
      on.push(p);
    }
  }
  return { out, on };
}

// Keep the part of a convex solid with n·p <= d. The new face on the plane is marked cut.
function clipSolid(faces, n, d) {
  const kept = [];
  const planePoints = [];
  let removed = false;
  for (const f of faces) {
    const { out, on } = clipPolygon(f.p, n, d);
    if (out.length < f.p.length || f.p.some((p) => dot(n, p) - d > EPS)) removed = true;
    if (out.length >= 3) kept.push({ ...f, p: out });
    planePoints.push(...on);
  }
  if (!removed) return faces;
  if (kept.length < 3) return null;
  const unique = [];
  for (const p of planePoints) if (!unique.some((q) => Math.hypot(q[0] - p[0], q[1] - p[1], q[2] - p[2]) < 1e-5)) unique.push(p);
  if (unique.length < 3) return kept.length >= 4 ? kept : null;
  const c = mid(unique);
  const helper = Math.abs(n[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1];
  const u = unit(cross(helper, n));
  const v = cross(n, u);
  unique.sort((a, b) => Math.atan2(dot(sub(a, c), v), dot(sub(a, c), u)) - Math.atan2(dot(sub(b, c), v), dot(sub(b, c), u)));
  let cap = unique;
  if (dot(newell(cap), n) < 0) cap = cap.reverse();
  kept.push({ p: cap, n, cut: true });
  return kept;
}

// Intersection of a convex solid with an axis-aligned box.
function clipBox(faces, [x0, x1, y0, y1, z0, z1]) {
  let f = faces;
  const planes = [[[1, 0, 0], x1], [[-1, 0, 0], -x0], [[0, 1, 0], y1], [[0, -1, 0], -y0], [[0, 0, 1], z1], [[0, 0, -1], -z0]];
  for (const [n, d] of planes) {
    if (!f) return null;
    f = clipSolid(f, n, d);
  }
  return f;
}

function bounds(faces) {
  const b = [Infinity, -Infinity, Infinity, -Infinity, Infinity, -Infinity];
  for (const f of faces)
    for (const p of f.p) {
      b[0] = Math.min(b[0], p[0]);
      b[1] = Math.max(b[1], p[0]);
      b[2] = Math.min(b[2], p[1]);
      b[3] = Math.max(b[3], p[1]);
      b[4] = Math.min(b[4], p[2]);
      b[5] = Math.max(b[5], p[2]);
    }
  return b;
}

function hull(points) {
  const s = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (s.length < 3) return s;
  const c = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [];
  for (const p of s) {
    while (lo.length >= 2 && c(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
    lo.push(p);
  }
  const up = [];
  for (let i = s.length - 1; i >= 0; i--) {
    const p = s[i];
    while (up.length >= 2 && c(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop();
    up.push(p);
  }
  return [...lo.slice(0, -1), ...up.slice(0, -1)];

function toneOfFace(n, P) {
  const { sinA, cosA } = cameraOf(P);
  if (n[2] > 0.97) return 4;
  const h = Math.hypot(n[0], n[1]) || 1;
  const lit = ((n[0] / h) * -sinA + (n[1] / h) * cosA + 1) / 2 + 0.3 * Math.max(0, n[2]);
  return Math.min(3, Math.max(0, Math.floor(lit * 4)));
}

const key3 = (p) => `${Math.round(p[0] * 1000)},${Math.round(p[1] * 1000)},${Math.round(p[2] * 1000)}`;

// Paint a convex solid. `hide(face)` may drop a face's own paint (a cut face that is only a seam inside the solid).
function paint(faces, P, { bevel = 0, hide } = {}) {

  for (const f of vis) {
    const path = pathOf(f.p.map((p) => iso(p, P)), true);
    if (f.cut) {
      if (!(hide && hide(f))) cuts.push(path);
    } else buckets[toneOfFace(f.n, P)].push(path);
    for (let i = 0; i < f.p.length; i++) {
      const a = f.p[i];
      const b = f.p[(i + 1) % f.p.length];
      const k = key3(a) < key3(b) ? `${key3(a)}|${key3(b)}` : `${key3(b)}|${key3(a)}`;
      const e = edges.get(k) || { a, b, n: 0, cut: false };
      e.n++;
      edges.set(k, e);
    }
  }
  const crease = [];
  for (const e of edges.values()) if (e.n === 2) crease.push(pathOf([iso(e.a, P), iso(e.b, P)]));

  const outline = pathOf(hull(flat), true);
  let bevelPath = "";

    for (const f of vis) {
      if (f.n[2] < 0.97 || f.cut) continue;
      const n = f.p.length;
      const c = mid(f.p);
      const front = f.p.map((a, i) => {
        const b = f.p[(i + 1) % n];
        const mm = mid([a, b]);

        return dot(out, V) > 0.02;
      });
      const inset = f.p.map((p) => {
        const d = sub(c, p);

function polySvg(paths, { tone = "hi", crease = "faint", lit = false, className = "", attr = "", inner = "" } = {}) {

  if (paths.cut) parts.push(`<path class="fk-cut" d="${paths.cut}"/>`);

// A vertical coil (axis z) as two lines: the half behind the axis and the half in front of it.
function coilZ(cx, cy, r, z0, z1, turns, P, perTurn = 20) {
  const { sinA, cosA } = cameraOf(P);
  const count = Math.max(1, Math.round(turns * perTurn));
  const back = [];
  const front = [];
  let run = [];
  let near = null;
  for (let i = 0; i <= count; i++) {
    const t = i / count;
    const a = t * turns * Math.PI * 2;
    const nx = Math.cos(a);
    const ny = Math.sin(a);
    const facing = nx * cosA + ny * sinA > 0;
    const pt = iso([cx + r * nx, cy + r * ny, z0 + (z1 - z0) * t], P);
    if (near === null) near = facing;
    if (facing !== near) {
      run.push(pt);
      (near ? front : back).push(pathOf(run));
      run = [pt];
      near = facing;
      continue;
    }
    run.push(pt);
  }
  if (run.length > 1) (near ? front : back).push(pathOf(run));
  return { back: back.join(""), front: front.join("") };
}
// The switch as numbers: a pure model with no DOM and no drawing. build.mjs draws from it and the live page
// runs it, so the readout, the contact and the leaf are one source. All lengths in mm, forces in cN.
const TRAVEL = 4.0; // total travel
const ACT = 2.0; // actuation point (contact closes going down)
const HYST = 0.4; // play of the contact system: it opens 0.4 mm higher than it closed
const RESET = ACT - HYST; // 1.6 mm
const SPRING_F0 = 30; // spring preload at the top, cN
const SPRING_K = 7.5; // spring rate, cN per mm: 30 + 7.5 * 4.0 = 60 cN at the bottom
const BUMP = { from: 0.9, to: 2.0, amp: 9 }; // tactile bump, cN: peak near 1.45 mm
const FRICTION = 4; // sliding friction of the stem, cN, sign follows the direction of travel

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function bumpAt(x) {
  if (x <= BUMP.from || x >= BUMP.to) return 0;
  return BUMP.amp * Math.pow(Math.sin((Math.PI * (x - BUMP.from)) / (BUMP.to - BUMP.from)), 1.6);

// Force the key pushes back with at travel x (mm); v is the speed in mm/s, positive going down.
function forceAt(x, v = 0) {
  return SPRING_F0 + SPRING_K * x + bumpAt(x) + FRICTION * clamp(v / 8, -1, 1);
}
// Play operator: the contact system follows the stem with up to HYST of lag on the way back.
function playAt(xb, x) {

const closedAt = (xb) => xb >= ACT - 1e-6;

// The leaf: a bent strip from the floor to a bend at the left wall, then a blade towards the middle.
// The stem's pusher presses it down at K; the tip T lands on the fixed contact; further travel bows the blade.
const LEAF = { t: 0.3, wall: -4.9, floor: -5.2, bend: -2.45, xK: -3.8, xT: -2.8, g0: 1.567, y0: -1.5, y1: 1.5 };

LEAF.reach = (LEAF.xT - LEAF.wall) / (LEAF.xK - LEAF.wall);
LEAF.dContact = ACT - LEAF.g0; // drop at K when the tip touches the pad
LEAF.padZ = LEAF.bend - LEAF.dContact * LEAF.reach - LEAF.t / 2; // top of the gold contact bump
function leafAt(xb) {
  const dK = Math.max(0, xb - LEAF.g0);
  const zK = LEAF.bend - dK;
  const zTfree = LEAF.bend - dK * LEAF.reach;
  const zT = Math.max(zTfree, LEAF.padZ + LEAF.t / 2);

// The parts of the switch that change shape while the key moves. Used by build.mjs for the first paint and
// inlined into the page, where the same two functions repaint the leaf and the spring on every frame.




const SPRING = { cx: 0, cy: 0, r: 2.1, z0: -5.03, top: 2.03, turns: 5, wire: 0.17 };

// The blade of the leaf: two flat strips bent at the pusher.
function bladeSvg(P, xb) {

    out += polySvg(paint(half, P), { tone: "hi", crease: "faint" });

}

// The spring in the same half-section as everything else: the half turns behind the plane as arcs, and the wire

function springSvg(P, x) {

  const z1 = SPRING.top - x;
  const per = 14;
  let arcs = "";
  let rings = "";
  const zAt = (a) => z0 + ((z1 - z0) * a) / (turns * Math.PI * 2);
  const at = (a) => [cx + r * Math.cos(a), cy + r * Math.sin(a), zAt(a)];
  for (let j = 0; j < turns; j++) {

    for (let s = 0; s <= per; s++) pts.push(iso(at(Math.PI * (2 * j + 1) + (Math.PI * s) / per), P));
    arcs += pathOf(pts);

const P = {"origin":[312.98549358706805,274.59767209193626],"scale":11.812119564331786,"azimuth":62,"elevation":38};
const WIDTH = 640;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");

const readout = document.querySelector("[data-readout]");

let x = 0, v = 0, xb = 0, target = 0;
let frame = 0, last = 0, clock = 0, touring = !still.matches, visible = false, idleTimer = 0;
let drawn = -1, drawnB = -1;
const fmt = (n) => n.toFixed(2).replace(".", ",");

function draw() {
  const closed = closedAt(xb);
  const t = translateAlong(P, [0, 0, -x]);
  for (const g of rigs) g.setAttribute("transform", t);
  if (Math.abs(xb - drawnB) > 0.002 || drawnB < 0) {
    bladeG.innerHTML = bladeSvg(P, xb);
    drawnB = xb;

  if (Math.abs(x - drawn) > 0.002 || drawn < 0) {

    frontG.innerHTML = s.front;

  if (readout.textContent !== text) readout.textContent = text;

  stage.setAttribute("aria-valuetext", text);

// the idle tour: rest, press slowly through the actuation point, hold at the stop, let go slowly
const ease = (u) => u * u * (3 - 2 * u);
function tourAt(c) {

  if (t < 4.2) return TRAVEL * ease((t - 0.8) / 3.4);
  if (t < 4.9) return TRAVEL;
  if (t < 7.6) return TRAVEL * (1 - ease((t - 4.9) / 2.7));

function tick(now) {

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// pointer: press and hold pushes the key to the stop; a vertical drag takes the key by the hand
let grab = null;
stage.addEventListener("pointerdown", (event) => {

  stage.focus({ preventScroll: true });

stage.addEventListener("pointermove", (event) => {

  const dy = event.clientY - grab.y;
  if (!grab.drag && Math.abs(dy) < 5) return;
  if (!grab.drag) { grab.drag = true; grab.y = event.clientY; grab.at = x; return; }
  const px = screenRise(1, P) * (svg.getBoundingClientRect().width / WIDTH);
  steer(grab.at + (event.clientY - grab.y) / px);

const letGo = () => { if (!grab) return; grab = null; steer(0); later(); };
stage.addEventListener("pointerup", letGo);
stage.addEventListener("pointercancel", letGo);
stage.addEventListener("keydown", (event) => {
  if (event.key !== " " && event.key !== "Enter") return;
  event.preventDefault();
  if (!event.repeat) steer(TRAVEL);
});
stage.addEventListener("keyup", (event) => {
  if (event.key !== " " && event.key !== "Enter") return;
  steer(0);
  later();
});
stage.addEventListener("blur", () => { if (!grab) { steer(0); later(); } });
draw();
</script></body></html>
